<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validify - Vendor Directory</title>
    <!-- Typography: Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons: Font Awesome 6.5.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="vendorDirectory.css">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Sidebar Placeholder -->
        <aside id="sidebar-container"></aside>

        <!-- Main Directory Area -->
        <main class="main-content">
            <header class="top-bar">
                <div>
                    <p class="page-subtitle">Vendor Directory</p>
                    <h1 class="page-title">Vendor Directory</h1>
                </div>
                <button class="icon-btn moon-btn" aria-label="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </header>

            <section class="directory-card">
                <div class="directory-header">
                    <div>
                        <p class="search-label">Search for vendor</p>
                        <div class="search-bar-container">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="search" class="vendor-search" placeholder="Search vendor" aria-label="Search vendor">
                        </div>
                    </div>
                    <button class="add-vendor-btn" type="button">
                        <i class="fa-solid fa-plus"></i>
                        Add Vendor
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="vendor-table">
                        <thead>
                            <tr>
                                <th>COMPANY NAME</th>
                                <th>SERVICES</th>
                                <th>CONTACT</th>
                                <th>DATE</th>
                            </tr>
                        </thead>
                        <tbody class="vendor-table-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="sidebar.js"></script>
    <script src="vendorDirectory.js"></script>
</body>
</html>
